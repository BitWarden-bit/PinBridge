[package]
name = "pinbridge-hub-core"
version = "0.1.0"
edition = "2021"
description = "Shared PinBridge Hub domain, Agent transport, and local IPC protocol"

[dependencies]
pinbridge-client = { path = "../pinbridge-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[package]
name = "pinbridge-agent"
version = "0.1.0"
edition = "2021"
description = "Rust debugger agent base on the PinBridge C ABI: event engines, bounded rings, batch worker"

[lib]
crate-type = ["cdylib"]

[features]
default = ["scripting"]
# In-agent CPython scripting host. x86 cross-builds set PYO3_CROSS_* and point
# PINBRIDGE_PYTHON_DIST at a 32-bit CPython 3.10 embeddable distribution.
# `--no-default-features` remains the explicit native-only fallback.
scripting = ["dep:pyo3"]

[dependencies]
pinbridge-sys = { path = "../pinbridge-sys" }
pinbridge-tool = { path = "../pinbridge-tool" }
pinbridge-proto = { path = "../pinbridge-proto" }
pinbridge-client = { path = "../pinbridge-client" }
# Embedded CPython for the in-agent scripting host. No auto-initialize: the
# interpreter is started manually on the scripting thread (PyConfig path) so
# agent_main never touches the OS loader during Pin's tool-load sequence.
pyo3 = { version = "0.22", optional = true, features = ["generate-import-lib"] }

[build-dependencies]
pinbridge-tool = { path = "../pinbridge-tool" }
